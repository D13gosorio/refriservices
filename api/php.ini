; Config del runtime PHP de Vercel.

; No mostrar errores ni información interna del servidor a los visitantes;
; los errores se registran vía error_log (ver el manejador definido en
; config.php) y no se imprimen.
display_errors = Off
display_startup_errors = Off
expose_php = Off
log_errors = On

; Sesiones. config.php ya fija estos valores con ini_set() antes de arrancar
; la sesión; repetirlos aquí evita que una sesión iniciada por otra vía (o un
; futuro punto de entrada) se quede con los valores flojos por defecto.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Misma ventana que la caducidad por inactividad de app/core/Sesion.php
; (30 minutos). El valor por defecto, 1440, borraría las sesiones antes.
session.gc_maxlifetime = 1800

; La aplicación no recibe archivos en ningún formulario: se administran solo
; nombres o URLs de imagen. Con la subida desactivada del todo, ninguna ruta
; puede recibir un archivo aunque se le añada un campo por descuido.
file_uploads = Off
upload_max_filesize = 0

; Los formularios más grandes son de unos pocos kilobytes. Poner un techo
; evita que se pueda ocupar memoria del servidor con cuerpos enormes.
post_max_size = 1M

; Nada en el código abre URLs remotas. Desactivarlo cierra de raíz la
; inclusión de archivos remotos y las peticiones salientes accidentales.
allow_url_fopen = Off
allow_url_include = Off
